blueprint:
  name: "Huis Sterkenburg: brand- en politiealarm"
  description: >
    Brandweer (post Nunspeet): slaapkamerlamp knippert rood-wit, overloop en
    voorraam 1 minuut aan, carport 4 minuten fel, buitendeur 1,5 minuut fel,
    daarna alles terug zoals het was. Google Home roept de melding om
    (tussen 23:00 en 08:00 alleen één keer "Brand").
    Politie (in de ingestelde plaatsen): slaapkamerlamp knippert blauw-wit
    en Google Home leest de melding voor (alleen tussen 08:00 en 23:00).
  domain: automation
  input:
    telefoons:
      name: Telefoons
      description: Welke telefoons krijgen een pop-up? (Home Assistant-app nodig)
      default: []
      selector:
        device:
          multiple: true
          filter:
            - integration: mobile_app
    knipperlampen:
      name: Slaapkamerlamp (knippert)
      description: Brandweer = rood-wit, politie = blauw-wit.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    lampen_aan:
      name: Overloop / trapgat en voorraam (1 minuut aan)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    carport:
      name: Carport (4 minuten fel)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    buitendeur:
      name: Buitendeur (1,5 minuut fel)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: light
    speakers:
      name: Speakers (Google Home / Sonos)
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player
    tts:
      name: Spraakdienst
      description: Meestal "Google Translate".
      default: ""
      selector:
        entity:
          filter:
            - domain: tts

mode: parallel
max: 5

triggers:
  - trigger: event
    event_type: meldkamer_melding

variables:
  m: "{{ trigger.event.data }}"
  politie: "{{ m.soort == 'politie' }}"
  telefoons: !input telefoons
  knipperlampen: !input knipperlampen
  lampen_aan: !input lampen_aan
  carport: !input carport
  buitendeur: !input buitendeur
  speakers: !input speakers
  tts: !input tts
  nacht: "{{ now().hour >= 23 or now().hour < 8 }}"
  route: "{{ m.route if m.route is mapping else {} }}"
  kleur: "{{ [0, 60, 255] if politie else [255, 0, 0] }}"
  knipper_keer: "{{ 15 if politie else 10 }}"
  titel: >-
    {{ '🧪 TEST · ' if m.test else '' }}{{ '👮 Politie' if politie else '🚒 Brandweer Nunspeet' }}{{ ' · P' ~ m.prio if m.prio else '' }}
  regel_route: >-
    {% if route.auto %}🚗 {{ route.auto.minuten }} min{% endif %}{% if route.fiets %} · 🚲 {{ route.fiets.minuten }} min{% endif %}{% if route.advies %} · {{ route.advies }}{% endif %}
  bericht: >-
    {{ m.kort or m.titel }}{% if m.adres %}

    📍 {{ m.adres }}{% endif %}{% if regel_route %}

    {{ regel_route }}{% endif %}
  knoppen: >-
    {% if route.maps_auto %}
    [{"action": "URI", "title": "🚗 Navigeer met auto", "uri": "{{ route.maps_auto }}"},
     {"action": "URI", "title": "🚲 Navigeer met fiets", "uri": "{{ route.maps_fiets }}"}]
    {% else %}[]{% endif %}
  uitspraak: >-
    {{ 'Test. ' if m.test else '' }}{{ 'Politiemelding' if politie else 'Brandweer Nunspeet' }}{{ ', prioriteit ' ~ m.prio if m.prio else '' }}. {{ m.kort or m.titel }}.
    {%- if route.auto %} Rijtijd auto {{ route.auto.minuten }} minuten.{% endif %}
    {%- if route.fiets %} Rijtijd fiets {{ route.fiets.minuten }} minuten.{% endif %}
    {%- if route.advies %} {{ route.advies }}.{% endif %}

conditions:
  - condition: template
    value_template: "{{ m.relevant }}"
  - condition: state
    entity_id: input_boolean.meldkamer_brandalarm_pauze
    state: "off"

actions:
  - parallel:
      # 1. Pop-up op de telefoon
      - repeat:
          for_each: "{{ telefoons }}"
          sequence:
            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
              continue_on_error: true
              data:
                title: "{{ titel }}"
                message: "{{ bericht }}"
                data:
                  url: /meldkamer
                  tag: meldkamer
                  actions: "{{ knoppen }}"
                  push:
                    interruption-level: critical
                    sound:
                      name: default
                      critical: 1
                      volume: 1.0

      # 2. Slaapkamerlamp knipperen (rood-wit of blauw-wit), daarna terug
      - if:
          - condition: template
            value_template: "{{ knipperlampen | length > 0 }}"
        then:
          - action: scene.create
            data:
              scene_id: alarm_voor_knipper
              snapshot_entities: "{{ knipperlampen }}"
          - repeat:
              count: "{{ knipper_keer }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ knipperlampen }}"
                  data:
                    rgb_color: "{{ kleur }}"
                    brightness: 255
                    transition: 0
                - delay:
                    milliseconds: 500
                - action: light.turn_on
                  target:
                    entity_id: "{{ knipperlampen }}"
                  data:
                    rgb_color: [255, 255, 255]
                    brightness: 255
                    transition: 0
                - delay:
                    milliseconds: 500
          - action: scene.turn_on
            target:
              entity_id: scene.alarm_voor_knipper

      # 3. Overloop en voorraam 1 minuut aan (alleen brandweer)
      - if:
          - condition: template
            value_template: "{{ not politie and lampen_aan | length > 0 }}"
        then:
          - action: scene.create
            data:
              scene_id: alarm_voor_overloop
              snapshot_entities: "{{ lampen_aan }}"
          - action: light.turn_on
            target:
              entity_id: "{{ lampen_aan }}"
            data:
              brightness_pct: 100
          - delay:
              seconds: 60
          - action: scene.turn_on
            target:
              entity_id: scene.alarm_voor_overloop

      # 4. Carport 4 minuten fel (alleen brandweer)
      - if:
          - condition: template
            value_template: "{{ not politie and carport | length > 0 }}"
        then:
          - action: scene.create
            data:
              scene_id: alarm_voor_carport
              snapshot_entities: "{{ carport }}"
          - action: light.turn_on
            target:
              entity_id: "{{ carport }}"
            data:
              brightness_pct: 100
          - delay:
              minutes: 4
          - action: scene.turn_on
            target:
              entity_id: scene.alarm_voor_carport

      # 5. Buitendeur 1,5 minuut fel (alleen brandweer)
      - if:
          - condition: template
            value_template: "{{ not politie and buitendeur | length > 0 }}"
        then:
          - action: scene.create
            data:
              scene_id: alarm_voor_buitendeur
              snapshot_entities: "{{ buitendeur }}"
          - action: light.turn_on
            target:
              entity_id: "{{ buitendeur }}"
            data:
              brightness_pct: 100
          - delay:
              seconds: 90
          - action: scene.turn_on
            target:
              entity_id: scene.alarm_voor_buitendeur

      # 6. Omroepen via Google Home / Sonos
      - if:
          - condition: template
            value_template: "{{ speakers | length > 0 and tts != '' }}"
        then:
          - choose:
              # 's Nachts brandweer: alleen één keer "Brand"
              - conditions:
                  - condition: template
                    value_template: "{{ nacht and not politie }}"
                sequence:
                  - action: tts.speak
                    continue_on_error: true
                    target:
                      entity_id: "{{ tts }}"
                    data:
                      media_player_entity_id: "{{ speakers }}"
                      message: "Brand."
                      cache: true
              # Overdag: hele melding een paar keer
              - conditions:
                  - condition: template
                    value_template: "{{ not nacht }}"
                sequence:
                  - repeat:
                      count: "{{ 2 if politie else 3 }}"
                      sequence:
                        - action: tts.speak
                          continue_on_error: true
                          target:
                            entity_id: "{{ tts }}"
                          data:
                            media_player_entity_id: "{{ speakers }}"
                            message: "{{ uitspraak }}"
                            cache: false
                        - delay:
                            seconds: 15
              # 's Nachts politie: stil
