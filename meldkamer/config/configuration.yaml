# Home Assistant: Huis Sterkenburg
# Standaardonderdelen van Home Assistant (zoals de app, energie, agenda's)
default_config:

homeassistant:
  name: Thuis
  country: NL
  language: nl
  time_zone: Europe/Amsterdam
  unit_system: metric
  currency: EUR
  packages: !include_dir_named packages

frontend:
  themes: !include_dir_merge_named themes

# Het meldkamer-dashboard als eigen pagina in het menu
panel_custom:
  - name: meldkamer-panel
    sidebar_title: Huis Sterkenburg
    sidebar_icon: mdi:home-lightning-bolt
    url_path: meldkamer
    module_url: /local/meldkamer/meldkamer-panel.js?v=1
    require_admin: false

# Brandweermeldingen, weer, vliegtuigen, afval en meer.
# Je eigen instellingen (adres, plaatsen, voertuig) staan in dit bestand:
meldkamer: !include meldkamer_instellingen.yaml

# Grote sensoren niet in de geschiedenis opslaan (scheelt veel ruimte)
recorder:
  purge_keep_days: 14
  exclude:
    entities:
      - sensor.meldkamer_laatste_melding
      - sensor.meldkamer_weer
      - sensor.meldkamer_vliegtuigen
      - sensor.meldkamer_buienradar
      - sensor.meldkamer_instellingen
      - sensor.meldkamer_afval
      - sensor.meldkamer_nieuws

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
